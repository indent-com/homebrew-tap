name: Update formulas

on:
  repository_dispatch:
    types: [update]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without v prefix). Leave empty for latest."

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Update formulas
        run: bun run update.ts ${{ github.event.client_payload.version || inputs.version || '' }}

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/
          version=$(grep '^  version' Formula/blit.rb | head -1 | sed 's/.*"\(.*\)"/\1/')
          git commit -m "update to ${version}"
          git checkout -b "update/${version}"
          git push origin "update/${version}"
          gh pr create --title "update to ${version}" --body "" --base main --head "update/${version}"
